name: poller
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poller
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright requests && playwright install --with-deps chromium
      - run: xvfb-run -a python poller_once.py
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Save state
        if: always()
        run: |
          git config user.name "poller"
          git config user.email "poller@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "state" && git push)